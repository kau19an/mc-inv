# pipeline de dados do jogo: baixa o jar oficial da mojang e extrai os arquivos do inventário.
# roda em dois casos:
#   - push nesta branch que mexe no pipeline
#   - chamado pelo workflow "mc-inv-data.yml" da main (todo dia + botão "rodar agora"),
#     porque o github só aceita agendamento e execução manual em workflows da branch padrão
name: Dados do jogo

on:
  push:
    branches: [project/mc-inv]
    paths:
      - 'scripts/data/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/data.yml'
  workflow_call:
    inputs:
      versions:
        description: 'tracked (última release + último snapshot) ou ids separados por vírgula'
        type: string
        default: tracked

permissions:
  contents: read
  checks: write # relatório como check run (o claude lê pela api)

# duas execuções seguidas: a mais nova cancela a anterior
concurrency:
  group: mc-inv-data
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # quando chamado pela main, o "commit atual" é o da main: por isso o ref fixo
      - uses: actions/checkout@v7
        with:
          ref: project/mc-inv

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      # o jar fica em cache entre execuções
      - uses: actions/cache@v6
        with:
          path: .cache/jars
          key: jars-${{ hashFiles('scripts/data/**') }}
          restore-keys: jars-

      - name: Extrair versões
        run: npm run data -- --source=official --versions=${{ inputs.versions || 'tracked' }}

      # resumo em dois lugares: na página da execução (pra quem abre no github) e como anotação
      # (a parte do resultado que o claude consegue ler pela api, via check runs)
      - name: Resumo
        run: |
          {
            echo '## Versões extraídas'
            echo
            for meta in .cache/versions/*/meta.json; do
              echo '```json'
              cat "$meta"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for meta in .cache/versions/*/meta.json; do
            echo "::notice title=$(jq -r '.id + " (" + .kind + ")"' "$meta")::$(jq -c '.counts' "$meta")"
          done

      # dump das abas: precisa de java (o jar da 26.x pede java 25)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Montar as abas do inventário criativo
        run: npm run dump -- --versions=${{ inputs.versions || 'tracked' }}

      # temporário: se o dump falhar, sonda o jar atrás das classes envolvidas
      - name: Sondar (se falhar)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=".cache/jars/$(jq -r '.latest.release' .cache/versions.json).jar"
          mkdir -p /tmp/jar && unzip -q -o "$jar" 'net/*' -d /tmp/jar
          {
            for class in net.minecraft.server.WorldLoader 'net.minecraft.server.WorldLoader$InitConfig' 'net.minecraft.server.WorldLoader$PackConfig' \
              'net.minecraft.server.WorldLoader$DataLoadContext' 'net.minecraft.server.WorldLoader$DataLoadOutput' \
              'net.minecraft.server.WorldLoader$WorldDataSupplier' 'net.minecraft.server.WorldLoader$ResultFactory' \
              net.minecraft.server.packs.repository.ServerPacksSource net.minecraft.world.level.WorldDataConfiguration \
              net.minecraft.server.ReloadableServerResources net.minecraft.core.LayeredRegistryAccess; do
              echo "## $class"
              javap -cp "$jar" -public "$class" 2>&1 | head -25
              echo
            done
            echo "## Main: chamadas ao WorldLoader e afins"
            javap -cp "$jar" -c -p net.minecraft.server.Main 2>&1 | grep -E 'WorldLoader|ServerPacksSource|WorldDataConfiguration|InitConfig|PackConfig|CommandSelection|LEVEL_GAMEMASTERS|PermissionSet|Util\.backgroundExecutor|\.join' | head -30
            echo
            echo "## CommandSelection / permissões"
            javap -cp "$jar" -public 'net.minecraft.commands.Commands$CommandSelection' 2>&1 | head -12
            javap -cp "$jar" -public net.minecraft.server.permissions.LevelBasedPermissionSet 2>&1 | head -20
          } > probe.txt
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='mc-inv: sondagem' -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion=neutral \
            -f 'output[title]=Sondagem' -f 'output[summary]=Classes envolvidas no erro do dump.' \
            -f "output[text]=$(head -c 65000 probe.txt)" > /dev/null

      # relatório das abas como check run (texto longo, que o claude lê pela api)
      - name: Relatório das abas
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f .cache/dump-report.md ] || exit 0
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='mc-inv: abas' -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion=neutral \
            -f 'output[title]=Abas do inventário criativo' \
            -f 'output[summary]=Abas montadas pelo próprio jogo (primeiros itens de cada uma).' \
            -f "output[text]=$(head -c 65000 .cache/dump-report.md)" > /dev/null
