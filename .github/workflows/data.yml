# pipeline de dados do jogo: baixa o jar oficial da mojang de cada versão, extrai os arquivos do inventário e
# publica no cloudflare r2 (mc-data.faariaz.com). detalhes em mc-inv/dados-no-r2.md (docs do projeto).
#
# três etapas:
#   1. planejar: compara o hash do pipeline com o que já foi publicado e monta a fila de versões
#   2. gerar: até 10 computadores em paralelo, cada um com um grupo da fila; envia cada versão pro r2 num lote novo
#   3. publicar: escreve a lista de versões, o controle dos lotes e o índice das páginas estáticas
#
# roda em dois casos:
#   - push nesta branch que mexe no pipeline
#   - chamado pelo workflow "mc-inv-data.yml" da main (todo dia + botão "rodar agora"),
#     porque o github só aceita agendamento e execução manual em workflows da branch padrão
#
# segredos (repositório): R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
# variáveis (repositório): R2_BUCKET (faariaz-mc-data), DATA_URL (https://mc-data.faariaz.com)
name: Dados do jogo

on:
  push:
    branches: [project/mc-inv]
    paths:
      - 'scripts/data/**'
      # arquivos do site que o build-data também usa (tipos, transformações, chaves de tradução, wiki, drops)
      - 'src/lib/icons/**'
      - 'src/lib/gui/types.ts'
      - 'src/lib/gui/ui-keys.ts'
      - 'src/lib/gui/wiki.ts'
      - 'src/lib/gui/drops.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/data.yml'
  workflow_call:
    inputs:
      versions:
        description: 'versões a gerar de novo mesmo se já estiverem em dia (ids separados por vírgula; "tracked" = nenhuma)'
        type: string
        default: tracked

permissions:
  contents: write # commitar o índice das páginas estáticas (src/data/mc-inv-index.json)
  checks: write # relatórios como check runs (o claude lê pela api)

# duas execuções seguidas: a mais nova espera a anterior terminar (cancelar no meio deixaria lotes órfãos no r2)
concurrency:
  group: mc-inv-data
  cancel-in-progress: false

env:
  DATA_URL: ${{ vars.DATA_URL }}
  R2_BUCKET: ${{ vars.R2_BUCKET }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  # o r2 não aceita as somas de verificação que o aws cli novo manda por padrão
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pipeline: ${{ steps.plan.outputs.pipeline }}
      lot: ${{ steps.plan.outputs.lot }}
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
      probe: ${{ steps.plan.outputs.probe }}
      dump: ${{ steps.plan.outputs.dump }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      # quando chamado pela main, o "commit atual" é o da main: por isso o ref fixo
      - uses: actions/checkout@v7
        with:
          ref: project/mc-inv
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci

      - name: Conferir a configuração do R2
        run: |
          missing=()
          [ -n "$DATA_URL" ] || missing+=(DATA_URL)
          [ -n "$R2_BUCKET" ] || missing+=(R2_BUCKET)
          [ -n "$AWS_ACCESS_KEY_ID" ] || missing+=(R2_ACCESS_KEY_ID)
          [ -n "$AWS_SECRET_ACCESS_KEY" ] || missing+=(R2_SECRET_ACCESS_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=R2 não configurado::faltam ${missing[*]} nos segredos/variáveis do repositório"
            exit 1
          fi

      - name: Lista de versões da Mojang
        run: npm run data -- --source=official --versions=none

      # modo de teste: "[só: id, id]" na mensagem do commit gera só essas versões
      - name: Planejar
        id: plan
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GITHUB_TOKEN: ${{ github.token }} # api do github (traduções das versões de piada) com limite maior
        run: node scripts/data/plan.ts --versions='${{ inputs.versions }}'

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false # um grupo que falha não derruba os outros
      matrix:
        versions: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: project/mc-inv
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      # dump das abas: precisa de java (o jar da 26.x pede java 25)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Extrair
        run: npm run data -- --source=official --versions=${{ matrix.versions }} --keep-going
      # o dump (abrir o jogo de cada versão) é a parte lenta: se o código dele não mudou, reaproveita o que já foi
      # feito (je/_dumps/<hash do dump>/<id>.tar.gz no R2) e só os ícones e o resto são refeitos
      - name: Reaproveitar dumps
        run: |
          for id in $(echo '${{ matrix.versions }}' | tr ',' ' '); do
            [ -f ".cache/versions/$id/meta.json" ] || continue
            if curl -sfL "$DATA_URL/je/_dumps/${{ needs.plan.outputs.dump }}/$id.tar.gz" -o /tmp/dump.tgz; then
              tar xzf /tmp/dump.tgz -C ".cache/versions/$id" && touch ".cache/versions/$id/dump-cached" && echo "♻ $id"
            fi
          done

      - name: Montar as abas do inventário criativo
        run: npm run dump -- --versions=${{ matrix.versions }} --keep-going

      - name: Guardar dumps novos
        run: |
          for id in $(echo '${{ matrix.versions }}' | tr ',' ' '); do
            dir=".cache/versions/$id"
            [ -f "$dir/creative_tabs.json" ] && [ ! -f "$dir/dump-cached" ] || continue
            files=""
            for file in creative_tabs.json specials.json player.json legacy-items; do [ -e "$dir/$file" ] && files="$files $file"; done
            tar czf /tmp/dump.tgz -C "$dir" $files
            aws s3 cp /tmp/dump.tgz "s3://$R2_BUCKET/je/_dumps/${{ needs.plan.outputs.dump }}/$id.tar.gz" \
              --endpoint-url "$R2_ENDPOINT" --only-show-errors --cache-control 'public, max-age=31536000, immutable'
          done
      - name: Gerar os dados do site
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: npm run build-data -- --versions=${{ matrix.versions }} --no-index --keep-going

      # cada versão vai pra je/<id>/<lote>/: caminho novo a cada mudança do pipeline, então pode ficar em cache
      # pra sempre (immutable) sem risco de o navegador misturar arquivos de lotes diferentes
      - name: Enviar pro R2
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: |
          for id in $(jq -r '.[]' .cache/built.json); do
            lot=$(jq -r --arg id "$id" '.[$id].lot' <<< "$TARGETS")
            aws s3 sync "public/data/je/$id" "s3://$R2_BUCKET/je/$id/$lot" \
              --endpoint-url "$R2_ENDPOINT" --only-show-errors --no-progress \
              --cache-control 'public, max-age=31536000, immutable'
            # folha de contato da versão (fora do lote: sempre a mais recente), pra conferir de olho
            [ -f ".cache/contact/$id.png" ] && aws s3 cp ".cache/contact/$id.png" "s3://$R2_BUCKET/je/_contact/$id.png" \
              --endpoint-url "$R2_ENDPOINT" --only-show-errors --content-type image/png --cache-control 'no-cache'
            echo "::notice title=$id::enviado (lote $lot)"
          done
          # as que este grupo devia gerar e não gerou ficam registradas como falha (só tentam de novo com outro pipeline)
          jq -n --arg lot '${{ needs.plan.outputs.lot }}' --arg pipeline '${{ needs.plan.outputs.pipeline }}' \
            --arg wanted '${{ matrix.versions }}' --slurpfile ids .cache/built.json \
            '{lot: $lot, pipeline: $pipeline, ids: $ids[0], failed: (($wanted | split(",")) - $ids[0])}' > result.json

      - uses: actions/upload-artifact@v7
        with:
          name: result-${{ strategy.job-index }}
          path: result.json
          retention-days: 1

      # erros completos das versões que falharam neste grupo (texto longo, que o claude lê pela api)
      - name: Relatório de falhas
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f .cache/failures.md ] || exit 0
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='mc-inv: falhas (grupo ${{ strategy.job-index }})' -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion=neutral \
            -f "output[title]=$(grep -c '^## ' .cache/failures.md) versão(ões) com falha" \
            -f 'output[summary]=Erro completo de cada versão que falhou neste grupo.' \
            -f "output[text]=$(head -c 65000 .cache/failures.md)" > /dev/null

      # relatório das abas como check run (texto longo, que o claude lê pela api)
      - name: Relatório das abas
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f .cache/dump-report.md ] || exit 0
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='mc-inv: abas (grupo ${{ strategy.job-index }})' -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion=neutral \
            -f 'output[title]=Abas do inventário criativo' \
            -f 'output[summary]=Abas montadas pelo próprio jogo (primeiros itens de cada uma).' \
            -f "output[text]=$(head -c 65000 .cache/dump-report.md)" > /dev/null

  publish:
    needs: [plan, build]
    # roda mesmo sem nada na fila (a lista da mojang pode ter mudado) e mesmo se algum grupo falhou
    # (as versões que deram certo entram; as outras continuam no lote anterior)
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: project/mc-inv
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Lista de versões da Mojang
        run: npm run data -- --source=official --versions=none
      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: .cache/results
          merge-multiple: false
      - name: Juntar os resultados
        run: |
          mkdir -p .cache/results
          n=0
          for file in .cache/results/*/result.json; do
            [ -f "$file" ] || continue
            n=$((n + 1)); mv "$file" ".cache/results/$n.json"
          done

      - name: Montar a lista e o índice
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: node scripts/data/publish.ts

      # comparação dos ícones entre versões (texto longo, que o claude lê pela api)
      - name: Relatório de saúde dos ícones
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=success
          grep -q '^# Tudo certo' .cache/publish/health.md || conclusion=neutral
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='mc-inv: saúde dos ícones' -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion=$conclusion \
            -f "output[title]=$(head -1 .cache/publish/health.md | sed 's/^# //')" \
            -f 'output[summary]=Ícones e modelos especiais que aparecem numa versão e somem em outra.' \
            -f "output[text]=$(head -c 65000 .cache/publish/health.md)" > /dev/null

      # a lista muda a cada versão nova: cache curto (5 minutos). o controle dos lotes não fica em cache nenhum
      - name: Enviar a lista pro R2
        run: |
          aws s3 cp .cache/publish/versions.json "s3://$R2_BUCKET/je/versions.json" --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json --cache-control 'public, max-age=300'
          for file in _builds.json _retired.json _failures.json; do
            aws s3 cp ".cache/publish/$file" "s3://$R2_BUCKET/je/$file" --endpoint-url "$R2_ENDPOINT" \
              --content-type application/json --cache-control 'no-store'
          done

      - name: Apagar dumps de códigos antigos
        run: |
          aws s3 ls "s3://$R2_BUCKET/je/_dumps/" --endpoint-url "$R2_ENDPOINT" | awk '/PRE/ {print $2}' | while read -r prefix; do
            [ "$prefix" = "${{ needs.plan.outputs.dump }}/" ] && continue
            aws s3 rm "s3://$R2_BUCKET/je/_dumps/$prefix" --recursive --endpoint-url "$R2_ENDPOINT" --only-show-errors
          done

      - name: Apagar lotes antigos
        run: |
          while read -r prefix; do
            [ -n "$prefix" ] || continue
            aws s3 rm "s3://$R2_BUCKET/$prefix" --recursive --endpoint-url "$R2_ENDPOINT" --only-show-errors
            echo "::notice title=Lote apagado::$prefix"
          done < .cache/publish/delete.txt

      # o índice muda as páginas estáticas (nomes dos itens nas urls): o push dispara o deploy da vercel e não
      # dispara este workflow de novo (src/data fica fora dos paths e pushes do token do actions não acionam workflows)
      - name: Commitar o índice
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/mc-inv-index.json
          if git diff --cached --quiet; then
            echo "::notice title=Índice::nada mudou"
            exit 0
          fi
          git commit -q -m "chore(data): índice das versões publicadas no r2"
          git pull -q --rebase origin project/mc-inv
          git push -q origin HEAD:project/mc-inv
          echo "::notice title=Índice::publicado em $(git rev-parse --short HEAD)"

  # ferramenta de desenvolvimento (autorizada pelo Kauan): se scripts/data/probe-classes.txt existir,
  # descompila as classes listadas com o vineflower (procura pelo nome simples se o pacote não bater) e publica o
  # código como check runs (partes de até 60 mil caracteres)
  probe:
    needs: plan
    if: needs.plan.outputs.probe == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: project/mc-inv
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      # a primeira linha pode ser "@version <id>" (descompila essa versão); sem ela, a release mais recente
      - name: Baixar o jar
        run: |
          version=$(sed -n 's/^@version[[:space:]]*//p' scripts/data/probe-classes.txt | head -1)
          [ -n "$version" ] || version=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r .latest.release)
          echo "PROBE_VERSION=$version" >> "$GITHUB_ENV"
          npm run data -- --source=official --versions="$version" --locales=en_us
          # até a 1.21.11 o jar vem embaralhado: a sondagem lê o jar traduzido com os mappings da Mojang
          echo "PROBE_JAR=$(node scripts/data/lib/remap.ts "$version" | tail -1)" >> "$GITHUB_ENV"
      - name: Descompilar classes (desenvolvimento)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ferramenta de investigação: um passo que falha não pode impedir a publicação do que deu certo
          set +e
          jar="$PROBE_JAR"
          ls -la "$jar" || { echo "::error::jar não encontrado: $jar"; ls -la .cache/jars; exit 1; }
          version=$(curl -s https://repo1.maven.org/maven2/org/vineflower/vineflower/maven-metadata.xml | grep -oP '(?<=<release>)[^<]+')
          curl -sfL -o /tmp/vineflower.jar "https://repo1.maven.org/maven2/org/vineflower/vineflower/$version/vineflower-$version.jar"
          mkdir -p /tmp/classes /tmp/source
          {
            echo "# classes em client/renderer/special:"
            unzip -l "$jar" | grep -oE 'net/minecraft/client/renderer/special/[A-Za-z$]+\.class' | grep -v '\$' | sed 's#.*/##' | tr '\n' ' '
            echo
          } > /tmp/listing.txt
          while read -r class; do
            [ -z "$class" ] && continue
            [[ "$class" == @* ]] && continue
            # arquivo de recurso do jar (shader, json…): vai como texto
            if [[ "$class" == assets/* ]]; then
              { echo; echo "// ===== $class"; unzip -p "$jar" "$class" || echo "não achei"; } >> /tmp/resources.txt
              continue
            fi
            file="${class//.//}"
            if ! unzip -l "$jar" "$file.class" > /dev/null 2>&1; then
              # pacote errado: procura a classe pelo nome simples
              found=$(unzip -l "$jar" | grep -oE "net/minecraft/[A-Za-z0-9/]*/${class##*.}\.class" | head -1)
              [ -z "$found" ] && { echo "não achei: $class" >> /tmp/listing.txt; continue; }
              file="${found%.class}"
              echo "achei em: ${file//\//.}" >> /tmp/listing.txt
            fi
            unzip -q -o "$jar" "$file.class" "$file\$*.class" -d /tmp/classes 2>/dev/null || unzip -q -o "$jar" "$file.class" -d /tmp/classes 2>/dev/null
          done < scripts/data/probe-classes.txt
          java -jar /tmp/vineflower.jar -e="$jar" /tmp/classes /tmp/source > /dev/null 2>&1 || true
          {
            cat /tmp/listing.txt
            cat /tmp/resources.txt 2>/dev/null
            find /tmp/source -name '*.java' | sort | while read -r f; do echo; echo "// ===== ${f#/tmp/source/}"; grep -v '^import ' "$f"; done
          } > /tmp/decompiled.txt
          split -C 60000 -d /tmp/decompiled.txt /tmp/part-
          total=$(ls /tmp/part-* | wc -l); n=0
          for part in /tmp/part-*; do
            n=$((n + 1))
            gh api "repos/$GITHUB_REPOSITORY/check-runs" \
              -f name="mc-inv: código ($n/$total)" -f head_sha="$GITHUB_SHA" \
              -f status=completed -f conclusion=neutral \
              -f "output[title]=Código descompilado de $PROBE_VERSION ($n/$total)" -f 'output[summary]=Classes de scripts/data/probe-classes.txt' \
              -f "output[text]=$(cat "$part")" > /dev/null
          done
